<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Adolfo Clemente, desarrollador full-stack en Murcia">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.3" fill="#E3DED2"/>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#D08C10" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D08C10" stop-opacity="0"/>
      <animate attributeName="cx" values="0.8;0.7;0.8" dur="12s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="1" r="0.6">
      <stop offset="0" stop-color="#3552D9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3552D9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
    <clipPath id="type">
      <rect x="80" y="300" width="0" height="44">
        <animate attributeName="width" from="0" to="528" begin="0.6s" dur="2.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, Menlo, monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.2s; } .d3 { animation-delay: 0.35s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; } .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#FBF9F4"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <rect width="1200" height="380" fill="url(#glow2)"/>

    <!-- estrella de ocho puntas girando muy despacio -->
    <g transform="translate(1000 190)">
      <g fill="none" stroke="#D08C10" stroke-linejoin="round">
        <g stroke-opacity="0.9" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
          <rect x="-78" y="-78" width="156" height="156"/>
          <rect x="-78" y="-78" width="156" height="156" transform="rotate(45)"/>
        </g>
        <g stroke-opacity="0.35" stroke-width="1.5">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="120s" repeatCount="indefinite"/>
          <rect x="-120" y="-120" width="240" height="240"/>
          <rect x="-120" y="-120" width="240" height="240" transform="rotate(45)"/>
        </g>
      </g>
      <circle r="10" fill="#D08C10">
        <animate attributeName="r" values="9;12;9" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="80" y="118" class="mono fade d1" font-size="20" fill="#D08C10">hola, soy</text>
    <text x="76" y="208" class="sans fade d2" font-size="84" font-weight="700" letter-spacing="-2.5" fill="#141821">Adolfo Clemente</text>
    <text x="80" y="258" class="sans fade d3" font-size="26" fill="#5C6475">desarrollador full-stack · Murcia, España</text>

    <g clip-path="url(#type)">
      <text x="80" y="330" class="mono" font-size="18" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#2E3546"><tspan fill="#D08C10">$</tspan> construyendo interfaces, APIs y cosas que se usan</text>
    </g>
    <rect class="cursor" x="80" y="314" width="10" height="21" fill="#D08C10">
      <animate attributeName="x" from="80" to="608" begin="0.6s" dur="2.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
